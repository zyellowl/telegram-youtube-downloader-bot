[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-youtube-downloader-bot"
version = "0.1.0"
description = "Telegram bot for downloading authorized public YouTube videos and audio."
requires-python = ">=3.12"
dependencies = [
  "deno>=2.6.6",
  "packaging>=24.0",
  "pydantic-settings>=2.0",
  "python-telegram-bot>=22.0",
  "yt-dlp[default]>=2026.08.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
ytdl-bot = "ytdl_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = ["live: opt-in tests that access YouTube or Telegram"]
